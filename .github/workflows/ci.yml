name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waitlist
          POSTGRES_PASSWORD: waitlist
          POSTGRES_DB: waitlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test -- --run

  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Wait for app
        run: |
          for i in $(seq 1 24); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 5
          done
          docker compose logs app
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integration tests against compose Postgres
        env:
          DATABASE_URL: postgresql+psycopg2://waitlist:waitlist@localhost:5432/waitlist
        run: |
          pip install -r backend/requirements.txt
          python -m pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: npm ci
      - working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: E2E tests against compose stack
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8000
        run: npx playwright test
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Tear down stack
        if: always()
        run: docker compose down -v
